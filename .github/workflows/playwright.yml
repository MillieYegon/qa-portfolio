name: Playwright E2E

on:
  push:
    branches: [main]
    paths: ['playwright-framework/**', '.github/workflows/playwright.yml']
  pull_request:
    paths: ['playwright-framework/**']
  schedule:
    - cron: '0 5 * * *' # nightly regression
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag to run (for example @smoke). Leave empty for the full suite.'
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: playwright-framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright-framework/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npx playwright test ${{ github.event.inputs.grep && format('--grep {0}', github.event.inputs.grep) || '' }}
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-framework/playwright-report
          retention-days: 14
